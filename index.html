<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fotos del Evento</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;text-align:center}header{background:#000;padding:20px 15px 25px}header img{max-width:180px;max-height:120px;display:block;margin:0 auto 15px}h1{margin:0;font-size:28px}.subtitulo{color:#aaa;margin-top:12px}.botones{background:#1c1c1c;padding:20px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:15px 22px;font-size:17px;font-weight:bold;cursor:pointer;background:#fff;color:#111}button:disabled{opacity:.5}.contenedor{max-width:1000px;margin:auto;padding:30px 15px}#zonaCamara{display:none}video,#fotoPreview{width:100%;max-width:700px;border-radius:18px;background:#000;display:block;margin:0 auto 15px}canvas{display:none}#fotoPreview{display:none}.controles-camara{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}#mensaje{min-height:30px;margin:20px auto;color:#ddd}.titulo-galeria{font-size:25px;margin-bottom:20px}.grid-fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px}.foto-card{background:#1d1d1d;border-radius:14px;padding:10px}.foto-card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}.foto-botones{display:flex;gap:7px;margin-top:9px}.foto-botones button{flex:1;padding:9px;font-size:13px}.estado{color:#999;padding:30px;grid-column:1/-1}.oculto{display:none!important}
#carrusel{display:none;position:fixed;inset:0;z-index:9990;background:#050505;overflow:hidden}#carruselHeader{height:70px;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292929}.ctitulo{font-size:22px;font-weight:bold}.cerrar{background:#222;color:#fff;border:1px solid #444;padding:10px 18px;border-radius:24px}.contador{position:absolute;right:25px;top:85px;color:#ddd;font-weight:bold}.principal{height:calc(100% - 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px 90px 100px;gap:14px}.fotoWrap{position:relative;max-width:min(1100px,88vw);max-height:calc(100vh - 210px);display:flex;align-items:center}.fotoGrande{max-width:100%;max-height:calc(100vh - 210px);object-fit:contain;border-radius:12px}.flecha{position:absolute;top:50%;transform:translateY(-50%);width:58px;height:58px;border-radius:50%;padding:0;background:#222;color:#fff;border:1px solid #444;font-size:38px;z-index:3}.prev{left:-75px}.next{right:-75px}.qrFoto{position:absolute;right:15px;bottom:15px;width:135px;background:#fff;color:#111;padding:8px;border-radius:11px;box-shadow:0 5px 25px #000}.qrFoto img{width:100%;display:block}.qrFoto div{font-size:11px;font-weight:bold;margin-top:5px}.acciones{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.acciones button{background:#1e1e1e;color:#fff;border:1px solid #444}.miniaturas{position:absolute;bottom:0;left:0;right:0;height:88px;background:#0a0a0a;border-top:1px solid #292929;display:flex;align-items:center;gap:10px;padding:8px 50px;overflow-x:auto}.mini{flex:0 0 90px;width:90px;height:65px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#222}.mini img{width:100%;height:100%;object-fit:cover}.mini.activa{border-color:#1597ff}
@media(max-width:700px){h1{font-size:23px}.botones{flex-direction:column;align-items:center}.botones button{width:100%;max-width:320px}.grid-fotos{grid-template-columns:repeat(2,1fr);gap:10px}.foto-botones{flex-direction:column}#carruselHeader{height:60px;padding:8px 12px}.ctitulo{font-size:17px}.principal{height:calc(100% - 60px);padding:10px 8px 88px}.fotoWrap{max-width:100%;max-height:calc(100vh - 190px)}.fotoGrande{max-height:calc(100vh - 190px)}.flecha{width:45px;height:45px;font-size:30px}.prev{left:5px}.next{right:5px}.qrFoto{width:105px;right:7px;bottom:7px;padding:6px}.qrFoto div{font-size:9px}.contador{top:68px;right:12px;font-size:13px}.miniaturas{height:78px;padding:8px 10px}.mini{flex-basis:75px;width:75px;height:55px}.acciones button{padding:11px 14px;font-size:14px}}
</style>
</head>
<body>
<header><img src="logo.png" alt="Logo del evento"><h1>📷 FOTOS DEL EVENTO</h1><div class="subtitulo">Compartí y descargá tus fotos</div></header>
<div class="botones"><button onclick="abrirCamara()">📷 SACAR UNA FOTO</button><button onclick="mostrarGaleria()">🖼️ VER FOTOS</button></div>
<main class="contenedor">
<section id="zonaCamara"><video id="video" autoplay playsinline></video><canvas id="canvas"></canvas><img id="fotoPreview"><div class="controles-camara"><button id="btnActivarCamara" onclick="iniciarCamara()">📷 ACTIVAR CÁMARA</button><button id="btnSacarFoto" onclick="sacarFoto()" class="oculto">📸 SACAR FOTO</button><button id="btnGuardar" onclick="subirFoto()" class="oculto">☁️ GUARDAR EN GOOGLE DRIVE</button><button id="btnNuevaFoto" onclick="nuevaFoto()" class="oculto">🔄 NUEVA FOTO</button><button id="btnCerrarCamara" onclick="terminarCamara()" class="oculto">❌ CERRAR CÁMARA</button></div></section>
<div id="mensaje"></div>
<section id="galeria"><div class="titulo-galeria">🖼️ GALERÍA</div><div id="listaFotos" class="grid-fotos"><div class="estado">Cargando fotos...</div></div></section>
</main>
<section id="carrusel"><div id="carruselHeader"><div class="ctitulo">📷 FOTOS DEL EVENTO</div><button class="cerrar" onclick="cerrarCarrusel()">✕ Cerrar</button></div><div class="contador" id="contador">0 / 0</div><div class="principal"><div class="fotoWrap"><button class="flecha prev" onclick="fotoAnterior()">‹</button><img id="fotoGrande" class="fotoGrande" alt="Foto del evento"><div class="qrFoto"><img id="qrGrande" alt="QR para descargar esta foto"><div>📱 Escaneá para descargar</div></div><button class="flecha next" onclick="fotoSiguiente()">›</button></div><div class="acciones"><button onclick="descargarActual()">⬇️ Descargar</button><button onclick="mostrarQRActual()">🔳 Ver QR</button></div></div><div id="miniaturas" class="miniaturas"></div></section>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyOKKJUMrNJvU9l4tRIPuaeF4H8k8-czm74NpXlyc9rpSV0T1BqgwRAdcAufHAey0GZSA/exec";
let stream=null,fotoOriginal=null,fotoConLogo=null,contadorJSONP=0,fotosGaleria=[],indiceActual=0,temporizadorCarrusel=null;
const INTERVALO_CARRUSEL=5000;
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),preview=document.getElementById('fotoPreview'),zona=document.getElementById('zonaCamara'),mensaje=document.getElementById('mensaje'),lista=document.getElementById('listaFotos');
function msg(t){mensaje.textContent=t}
function abrirCamara(){zona.style.display='block';document.getElementById('galeria').style.display='none';msg('');zona.scrollIntoView({behavior:'smooth'});}
async function iniciarCamara(){try{msg('Solicitando acceso a la cámara...');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;video.style.display='block';preview.style.display='none';btnActivarCamara.classList.add('oculto');btnSacarFoto.classList.remove('oculto');btnCerrarCamara.classList.remove('oculto');msg('Cámara activada. ¡Sonreí y sacá la foto! 📸')}catch(e){console.error(e);msg('No se pudo activar la cámara. Revisá los permisos.')}}
async function sacarFoto(){if(!stream)return msg('Primero tenés que activar la cámara.');const w0=video.videoWidth,h0=video.videoHeight;if(!w0||!h0)return msg('Esperá un momento hasta que la cámara esté lista.');let w=w0,h=h0;if(w>1800){h=Math.round(h*1800/w);w=1800}canvas.width=w;canvas.height=h;const c=canvas.getContext('2d');c.drawImage(video,0,0,w,h);fotoOriginal=canvas.toDataURL('image/jpeg',.92);const logo=new Image();logo.onload=()=>{c.drawImage(video,0,0,w,h);const m=25,lw=Math.min(w*.25,350),lh=lw*logo.naturalHeight/logo.naturalWidth;c.drawImage(logo,w-lw-m,h-lh-m,lw,lh);fotoConLogo=canvas.toDataURL('image/jpeg',.92);preview.src=fotoConLogo;preview.style.display='block';video.style.display='none';btnSacarFoto.classList.add('oculto');btnGuardar.classList.remove('oculto');msg('Foto lista. Podés guardarla en Google Drive.')};logo.onerror=()=>{fotoConLogo=fotoOriginal;preview.src=fotoOriginal;preview.style.display='block';video.style.display='none';btnSacarFoto.classList.add('oculto');btnGuardar.classList.remove('oculto');msg('Foto lista. No se encontró el logo, se guardará sin logo.')};logo.src='logo.png'}
async function subirFoto(){if(!fotoOriginal||!fotoConLogo)return msg('Primero tenés que sacar una foto.');btnGuardar.disabled=true;btnGuardar.textContent='⏳ GUARDANDO...';msg('Guardando las fotos en Google Drive...');try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({original:fotoOriginal,logo:fotoConLogo})});msg('✅ Foto enviada. Esperá unos segundos y aparecerá en la galería.');btnGuardar.classList.add('oculto');btnNuevaFoto.classList.remove('oculto');setTimeout(cargarGaleria,4000)}catch(e){console.error(e);msg('❌ No se pudo enviar la foto.')}btnGuardar.disabled=false;btnGuardar.textContent='☁️ GUARDAR EN GOOGLE DRIVE'}
function nuevaFoto(){fotoOriginal=null;fotoConLogo=null;preview.src='';preview.style.display='none';video.style.display='block';btnNuevaFoto.classList.add('oculto');btnGuardar.classList.add('oculto');btnSacarFoto.classList.remove('oculto');msg('Podés sacar otra foto.')}
function terminarCamara(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;zona.style.display='none';document.getElementById('galeria').style.display='block';btnActivarCamara.classList.remove('oculto');btnSacarFoto.classList.add('oculto');btnGuardar.classList.add('oculto');btnNuevaFoto.classList.add('oculto');btnCerrarCamara.classList.add('oculto')}
function mostrarGaleria(){document.getElementById('galeria').style.display='block';zona.style.display='none';cargarGaleria();document.getElementById('galeria').scrollIntoView({behavior:'smooth'})}
function cargarGaleria(){lista.innerHTML='<div class="estado">⏳ Cargando fotos...</div>';contadorJSONP++;const cb='mostrarFotos_'+Date.now()+'_'+contadorJSONP;window[cb]=f=>{mostrarFotos(f);delete window[cb]};const s=document.createElement('script');s.src=SCRIPT_URL+'?callback='+encodeURIComponent(cb);s.onerror=()=>{lista.innerHTML='<div class="estado">⚠️ No se pudo conectar con la galería.</div>';delete window[cb]};document.body.appendChild(s);setTimeout(()=>s.remove(),10000)}
function urlVisualizacion(foto){
  if (foto && foto.id) {
    return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(foto.id) + '&sz=w2000';
  }
  return foto && foto.url ? foto.url : '';
} function mostrarFotos(fotos){if(!Array.isArray(fotos)){lista.innerHTML='<div class="estado">No se recibieron fotos.</div>';return}fotosGaleria=fotos;if(!fotos.length){lista.innerHTML='<div class="estado">Todavía no hay fotos.</div>';return}lista.innerHTML='';fotos.forEach((foto,i)=>{const card=document.createElement('div');card.className='foto-card';const img=document.createElement('img');img.src=urlVisualizacion(foto);img.alt=foto.nombre||'Foto';img.onclick=()=>abrirCarrusel(i);const bs=document.createElement('div');bs.className='foto-botones';const ver=document.createElement('button');ver.textContent='👁️ Ver';ver.onclick=()=>abrirCarrusel(i);const dl=document.createElement('button');dl.textContent='⬇️ Descargar';dl.onclick=()=>window.open(foto.download||foto.url,'_blank');bs.append(ver,dl);card.append(img,bs);lista.append(card)})}
function abrirCarrusel(i){if(!fotosGaleria.length)return;indiceActual=Math.max(0,Math.min(i,fotosGaleria.length-1));document.getElementById('carrusel').style.display='block';document.body.style.overflow='hidden';actualizarCarrusel();iniciarCarruselAutomatico()}
function cerrarCarrusel(){document.getElementById('carrusel').style.display='none';document.body.style.overflow='';detenerCarruselAutomatico()}
function actualizarCarrusel(){const f=fotosGaleria[indiceActual];const grande=document.getElementById('fotoGrande');
    grande.src=urlVisualizacion(f);
    grande.onerror=function(){ console.error('No se pudo cargar la imagen', f); this.alt='No se pudo cargar esta foto'; }; document.getElementById('contador').textContent=(indiceActual+1)+' / '+fotosGaleria.length;document.getElementById('qrGrande').src='https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+encodeURIComponent(f.url);const mini=document.getElementById('miniaturas');mini.innerHTML='';fotosGaleria.forEach((x,i)=>{const b=document.createElement('button');b.className='mini'+(i===indiceActual?' activa':'');const im=document.createElement('img');im.src=urlVisualizacion(x);im.alt='Miniatura '+(i+1);b.appendChild(im);b.onclick=()=>{indiceActual=i;actualizarCarrusel()};mini.appendChild(b)});const a=mini.querySelector('.activa');if(a)a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
function iniciarCarruselAutomatico(){
  detenerCarruselAutomatico();
  if(fotosGaleria.length>1){
    temporizadorCarrusel=setInterval(()=>{
      if(document.getElementById('carrusel').style.display==='block') fotoSiguiente();
    },INTERVALO_CARRUSEL);
  }
}
function detenerCarruselAutomatico(){
  if(temporizadorCarrusel){clearInterval(temporizadorCarrusel);temporizadorCarrusel=null;}
}
function fotoSiguiente(){if(fotosGaleria.length){indiceActual=(indiceActual+1)%fotosGaleria.length;actualizarCarrusel()}}
function fotoAnterior(){if(fotosGaleria.length){indiceActual=(indiceActual-1+fotosGaleria.length)%fotosGaleria.length;actualizarCarrusel()}}
function descargarActual(){if(fotosGaleria.length)window.open(fotosGaleria[indiceActual].download||fotosGaleria[indiceActual].url,'_blank')}
function mostrarQRActual(){document.getElementById('qrGrande').scrollIntoView({behavior:'smooth',block:'center'})}
document.addEventListener('keydown',e=>{if(document.getElementById('carrusel').style.display!=='block')return;if(e.key==='ArrowRight')fotoSiguiente();if(e.key==='ArrowLeft')fotoAnterior();if(e.key==='Escape')cerrarCarrusel()});window.addEventListener('load',cargarGaleria);setInterval(cargarGaleria,15000);
</script>
</body>
</html>
