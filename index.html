<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fotos del Evento</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;text-align:center}header{background:#000;padding:20px 15px 25px}header img{max-width:180px;max-height:120px;display:block;margin:0 auto 15px}h1{margin:0;font-size:28px}.subtitulo{color:#aaa;margin-top:12px}.botones{background:#1c1c1c;padding:20px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:15px 22px;font-size:17px;font-weight:bold;cursor:pointer;background:#fff;color:#111}button:disabled{opacity:.5}.contenedor{max-width:1000px;margin:auto;padding:30px 15px}#zonaCamara{display:none}video,#fotoPreview{width:100%;max-width:700px;border-radius:18px;background:#000;display:block;margin:0 auto 15px}canvas{display:none}#fotoPreview{display:none}.controles-camara{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}#mensaje{min-height:30px;margin:20px auto;color:#ddd}.titulo-galeria{font-size:25px;margin-bottom:20px}.grid-fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px}.foto-card{background:#1d1d1d;border-radius:14px;padding:10px}.foto-card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}.foto-botones{display:flex;gap:7px;margin-top:9px}.foto-botones button{flex:1;padding:9px;font-size:13px}.estado{color:#999;padding:30px;grid-column:1/-1}.oculto{display:none!important}

#carrusel{
  display:none;
  position:fixed;
  inset:0;
  z-index:9990;
  background:#000;
  overflow:hidden;
}
.principal{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.fotoWrap{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  max-width:none;
  max-height:none;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.fotoGrande{
  width:100vw;
  height:100vh;
  max-width:none;
  max-height:none;
  object-fit:contain;
  border-radius:0;
  background:#000;
  opacity:1;
  transition:opacity .8s ease-in-out;
}
.fotoGrande.fade{
  opacity:0;
}
.qrFoto{
  position:absolute;
  top:22px;
  right:22px;
  width:145px;
  background:rgba(255,255,255,.97);
  color:#111;
  padding:9px;
  border-radius:12px;
  box-shadow:0 5px 25px rgba(0,0,0,.55);
  z-index:5;
}
.qrFoto img{
  width:100%;
  display:block;
  border-radius:5px;
}
.qrFoto div{
  font-size:11px;
  font-weight:bold;
  margin-top:5px;
  line-height:1.2;
}
.flecha{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:52px;
  height:52px;
  border-radius:50%;
  padding:0;
  background:rgba(0,0,0,.25);
  color:#fff;
  border:1px solid rgba(255,255,255,.25);
  font-size:36px;
  z-index:6;
  opacity:.15;
  transition:opacity .2s;
}
.flecha:hover{opacity:.8}
.prev{left:18px}
.next{right:18px}
.cerrar{
  position:absolute;
  top:18px;
  left:18px;
  z-index:10;
  background:rgba(0,0,0,.3);
  color:#fff;
  border:1px solid rgba(255,255,255,.25);
  padding:9px 15px;
  border-radius:22px;
  opacity:.2;
  transition:opacity .2s;
}
.cerrar:hover{opacity:.85}
#carruselHeader{
  position:absolute;
  inset:0;
  height:auto;
  padding:0;
  border:0;
  z-index:9;
  pointer-events:none;
}
#carruselHeader .cerrar{pointer-events:auto}
.ctitulo,.contador,.acciones,.miniaturas{display:none!important}

@media(max-width:700px){
  .fotoGrande{
    width:100vw;
    height:100vh;
    object-fit:contain;
  }
  .qrFoto{
    width:108px;
    top:12px;
    right:12px;
    padding:6px;
    border-radius:9px;
  }
  .qrFoto div{
    font-size:9px;
    margin-top:4px;
  }
  .flecha{
    width:44px;
    height:44px;
    font-size:29px;
    opacity:.12;
  }
  .prev{left:7px}
  .next{right:7px}
  .cerrar{
    top:10px;
    left:10px;
    padding:7px 11px;
    font-size:12px;
    opacity:.18;
  }
}
</style>
</head>
<body>
<header><img src="logo.png" alt="Logo del evento"><h1>📷 FOTOS DEL EVENTO</h1><div class="subtitulo">Compartí y descargá tus fotos</div></header>
<div class="botones"><button onclick="abrirCamara()">📷 SACAR UNA FOTO</button><button onclick="mostrarGaleria()">🖼️ VER FOTOS</button></div>
<main class="contenedor">
<section id="zonaCamara"><video id="video" autoplay playsinline></video><canvas id="canvas"></canvas><img id="fotoPreview"><div class="controles-camara"><button id="btnActivarCamara" onclick="iniciarCamara()">📷 ACTIVAR CÁMARA</button><button id="btnSacarFoto" onclick="sacarFoto()" class="oculto">📸 SACAR FOTO</button><button id="btnGuardar" onclick="subirFoto()" class="oculto">☁️ GUARDAR EN GOOGLE DRIVE</button><button id="btnNuevaFoto" onclick="nuevaFoto()" class="oculto">🔄 NUEVA FOTO</button><button id="btnCerrarCamara" onclick="terminarCamara()" class="oculto">❌ CERRAR CÁMARA</button></div></section>
<div id="mensaje"></div>
<section id="galeria"><div class="titulo-galeria">🖼️ GALERÍA</div><div id="listaFotos" class="grid-fotos"><div class="estado">Cargando fotos...</div></div></section>
</main>
<section id="carrusel"><div id="carruselHeader"><div class="ctitulo"></div><button class="cerrar" onclick="cerrarCarrusel()">✕</button></div><div class="principal"><div class="fotoWrap"><button class="flecha prev" onclick="fotoAnterior()">‹</button><img id="fotoGrande" class="fotoGrande" alt="Foto del evento"><div class="qrFoto"><img id="qrGrande" alt="QR para descargar esta foto"><div>📱 Escaneá para descargar</div></div><button class="flecha next" onclick="fotoSiguiente()">›</button></div></div></section>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyOKKJUMrNJvU9l4tRIPuaeF4H8k8-czm74NpXlyc9rpSV0T1BqgwRAdcAufHAey0GZSA/exec";
let stream=null,fotoOriginal=null,fotoConLogo=null,contadorJSONP=0,fotosGaleria=[],indiceActual=0,temporizadorCarrusel=null;
const INTERVALO_CARRUSEL=6000;
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),preview=document.getElementById('fotoPreview'),zona=document.getElementById('zonaCamara'),mensaje=document.getElementById('mensaje'),lista=document.getElementById('listaFotos');
function msg(t){mensaje.textContent=t}
function abrirCamara(){zona.style.display='block';document.getElementById('galeria').style.display='none';msg('');zona.scrollIntoView({behavior:'smooth'});}
async function iniciarCamara(){try{msg('Solicitando acceso a la cámara...');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}},audio:false});video.srcObject=stream;video.style.display='block';preview.style.display='none';btnActivarCamara.classList.add('oculto');btnSacarFoto.classList.remove('oculto');btnCerrarCamara.classList.remove('oculto');msg('Cámara activada. ¡Sonreí y sacá la foto! 📸')}catch(e){console.error(e);msg('No se pudo activar la cámara. Revisá los permisos.')}}
async function sacarFoto(){if(!stream)return msg('Primero tenés que activar la cámara.');const w0=video.videoWidth,h0=video.videoHeight;if(!w0||!h0)return msg('Esperá un momento hasta que la cámara esté lista.');let w=w0,h=h0;canvas.width=w;canvas.height=h;const c=canvas.getContext('2d');c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';c.drawImage(video,0,0,w,h);fotoOriginal=canvas.toDataURL('image/jpeg',.98);const logo=new Image();logo.onload=()=>{c.drawImage(video,0,0,w,h);const m=25,lw=Math.min(w*.25,350),lh=lw*logo.naturalHeight/logo.naturalWidth;c.drawImage(logo,w-lw-m,h-lh-m,lw,lh);fotoConLogo=canvas.toDataURL('image/jpeg',.98);preview.src=fotoConLogo;preview.style.display='block';video.style.display='none';btnSacarFoto.classList.add('oculto');btnGuardar.classList.remove('oculto');msg('Foto lista. Podés guardarla en Google Drive.')};logo.onerror=()=>{fotoConLogo=fotoOriginal;preview.src=fotoOriginal;preview.style.display='block';video.style.display='none';btnSacarFoto.classList.add('oculto');btnGuardar.classList.remove('oculto');msg('Foto lista. No se encontró el logo, se guardará sin logo.')};logo.src='logo.png'}
async function subirFoto(){if(!fotoOriginal||!fotoConLogo)return msg('Primero tenés que sacar una foto.');btnGuardar.disabled=true;btnGuardar.textContent='⏳ GUARDANDO...';msg('Guardando las fotos en Google Drive...');try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({original:fotoOriginal,logo:fotoConLogo})});msg('✅ Foto enviada. Esperá unos segundos y aparecerá en la galería.');btnGuardar.classList.add('oculto');btnNuevaFoto.classList.remove('oculto');setTimeout(cargarGaleria,4000)}catch(e){console.error(e);msg('❌ No se pudo enviar la foto.')}btnGuardar.disabled=false;btnGuardar.textContent='☁️ GUARDAR EN GOOGLE DRIVE'}
function nuevaFoto(){fotoOriginal=null;fotoConLogo=null;preview.src='';preview.style.display='none';video.style.display='block';btnNuevaFoto.classList.add('oculto');btnGuardar.classList.add('oculto');btnSacarFoto.classList.remove('oculto');msg('Podés sacar otra foto.')}
function terminarCamara(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;zona.style.display='none';document.getElementById('galeria').style.display='block';btnActivarCamara.classList.remove('oculto');btnSacarFoto.classList.add('oculto');btnGuardar.classList.add('oculto');btnNuevaFoto.classList.add('oculto');btnCerrarCamara.classList.add('oculto')}
function mostrarGaleria(){
  zona.style.display='none';
  const pagina=document.documentElement;
  if(pagina.requestFullscreen){
    pagina.requestFullscreen().catch(()=>{});
  }
  cargarGaleria(true);
}
function cargarGaleria(abrirAlTerminar=false){lista.innerHTML='<div class="estado">⏳ Cargando fotos...</div>';contadorJSONP++;const cb='mostrarFotos_'+Date.now()+'_'+contadorJSONP;window[cb]=f=>{mostrarFotos(f);delete window[cb]; if(abrirAlTerminar && fotosGaleria.length){ abrirCarrusel(0); }};const s=document.createElement('script');s.src=SCRIPT_URL+'?callback='+encodeURIComponent(cb);s.onerror=()=>{lista.innerHTML='<div class="estado">⚠️ No se pudo conectar con la galería.</div>';delete window[cb]};document.body.appendChild(s);setTimeout(()=>s.remove(),10000)}
function urlVisualizacion(foto){
  if (foto && foto.id) {
    return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(foto.id) + '&sz=w2000';
  }
  return foto && foto.url ? foto.url : '';
} function mostrarFotos(fotos){if(!Array.isArray(fotos)){lista.innerHTML='<div class="estado">No se recibieron fotos.</div>';return}fotosGaleria=fotos;if(!fotos.length){lista.innerHTML='<div class="estado">Todavía no hay fotos.</div>';return}lista.innerHTML='';fotos.forEach((foto,i)=>{const card=document.createElement('div');card.className='foto-card';const img=document.createElement('img');img.src=urlVisualizacion(foto);img.alt=foto.nombre||'Foto';img.onclick=()=>abrirCarrusel(i);const bs=document.createElement('div');bs.className='foto-botones';const ver=document.createElement('button');ver.textContent='👁️ Ver';ver.onclick=()=>abrirCarrusel(i);const dl=document.createElement('button');dl.textContent='⬇️ Descargar';dl.onclick=()=>window.open(foto.download||foto.url,'_blank');bs.append(ver,dl);card.append(img,bs);lista.append(card)})}
function abrirCarrusel(i){
  if(!fotosGaleria.length)return;
  indiceActual=Math.max(0,Math.min(i,fotosGaleria.length-1));
  document.getElementById('carrusel').style.display='block';
  document.body.style.overflow='hidden';
  actualizarCarrusel();
  iniciarCarruselAutomatico();
}
function cerrarCarrusel(){document.getElementById('carrusel').style.display='none';document.body.style.overflow='';detenerCarruselAutomatico(); if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});}}
function actualizarCarrusel(){
  const f=fotosGaleria[indiceActual];
  const grande=document.getElementById('fotoGrande');
  const nuevaUrl=urlVisualizacion(f);

  grande.classList.add('fade');

  setTimeout(function(){
    grande.onload=function(){
      grande.classList.remove('fade');
    };
    grande.onerror=function(){
      console.error('No se pudo cargar la imagen', f);
      grande.classList.remove('fade');
      grande.alt='No se pudo cargar esta foto';
    };
    grande.src=nuevaUrl;
  },400);

  document.getElementById('qrGrande').src=
    'https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+
    encodeURIComponent(f.url);
}
function iniciarCarruselAutomatico(){
  detenerCarruselAutomatico();
  if(fotosGaleria.length>1){
    temporizadorCarrusel=setInterval(()=>{
      if(document.getElementById('carrusel').style.display==='block') fotoSiguiente();
    },INTERVALO_CARRUSEL);
  }
}
function detenerCarruselAutomatico(){
  if(temporizadorCarrusel){clearInterval(temporizadorCarrusel);temporizadorCarrusel=null;}
}
function fotoSiguiente(){if(fotosGaleria.length){indiceActual=(indiceActual+1)%fotosGaleria.length;actualizarCarrusel();iniciarCarruselAutomatico()}}
function fotoAnterior(){if(fotosGaleria.length){indiceActual=(indiceActual-1+fotosGaleria.length)%fotosGaleria.length;actualizarCarrusel();iniciarCarruselAutomatico()}}
function descargarActual(){if(fotosGaleria.length)window.open(fotosGaleria[indiceActual].download||fotosGaleria[indiceActual].url,'_blank')}
function mostrarQRActual(){document.getElementById('qrGrande').scrollIntoView({behavior:'smooth',block:'center'})}
document.addEventListener('keydown',e=>{if(document.getElementById('carrusel').style.display!=='block')return;if(e.key==='ArrowRight')fotoSiguiente();if(e.key==='ArrowLeft')fotoAnterior();if(e.key==='Escape')cerrarCarrusel()});window.addEventListener('load',cargarGaleria);setInterval(cargarGaleria,15000);
</script>
</body>
</html>
