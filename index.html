<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Feliz Fest 2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}
body{overflow:hidden}
button{font:inherit}

#inicio,#camara{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#inicio{gap:18px;padding:24px}
#inicio img{max-width:220px;max-height:180px;object-fit:contain;margin-bottom:20px}
.btn{border:0;border-radius:16px;padding:18px 28px;width:min(330px,88vw);font-size:20px;font-weight:700;cursor:pointer}
.btn-primary{background:#fff;color:#111}
.btn-secondary{background:#333;color:#fff;border:1px solid #666}

#camara{display:none;position:relative;background:#000}
#video{width:100%;height:100%;object-fit:cover}
.camera-controls{position:absolute;left:0;right:0;bottom:0;padding:18px;display:flex;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.control{border:0;border-radius:999px;padding:13px 18px;background:rgba(255,255,255,.92);color:#111;font-weight:700;cursor:pointer}
#capture{width:76px;height:76px;border-radius:50%;padding:0;border:6px solid #fff;background:#ddd}
#volver{position:absolute;top:18px;left:18px;z-index:5}
#cambioCamara{position:absolute;top:18px;right:18px;z-index:5}

#mensaje{position:absolute;left:50%;bottom:115px;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:12px 18px;border-radius:12px;display:none;text-align:center;z-index:10;white-space:nowrap}

#preview{display:none;position:fixed;inset:0;background:#000;z-index:15;flex-direction:column;align-items:center;justify-content:center}
#previewImg{width:100%;height:calc(100% - 115px);object-fit:contain}
.previewButtons{height:115px;width:100%;display:flex;justify-content:center;align-items:center;gap:12px;padding:15px;background:linear-gradient(transparent,#000)}
.previewButtons .btn{width:auto;min-width:150px;padding:15px 20px;font-size:16px}

#galeria{display:none;position:fixed;inset:0;background:#000;z-index:20}
#fotoActual{width:100%;height:100%;object-fit:contain;opacity:1;transition:opacity .8s ease}
#qr{position:absolute;top:18px;right:18px;width:92px;height:92px;background:#fff;padding:5px;border-radius:8px}
#cerrarGaleria{position:absolute;top:18px;left:18px;background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:50%;width:42px;height:42px;cursor:pointer;font-size:22px}
#contador{position:absolute;top:24px;left:72px;background:rgba(0,0,0,.45);padding:7px 11px;border-radius:10px;font-size:14px}
.flecha{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.25);border:0;color:#fff;font-size:38px;width:52px;height:70px;cursor:pointer;opacity:.55}
#prev{left:8px}#next{right:8px}
#sinFotos{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:2}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.modal{background:#fff;color:#111;border-radius:18px;padding:26px;width:min(380px,92vw);text-align:center}
.modal h2{margin-top:0}
.modal input{width:100%;padding:14px;border:1px solid #bbb;border-radius:10px;font-size:18px;margin:10px 0 14px}
.modal .btn{width:100%;margin-top:8px}
#errorClave{color:#c00;display:none;margin:5px 0 10px}
</style>
</head>
<body>

<section id="inicio">
  <img src="logo.png" alt="Logo del evento" onerror="this.style.display='none'">
  <button class="btn btn-primary" id="sacarFoto">📸 SACAR FOTO</button>
  <button class="btn btn-secondary" id="verFotos">🖼️ VER FOTOS</button>
</section>

<section id="camara">
  <video id="video" autoplay playsinline muted></video>
  <button class="control" id="volver">← Volver</button>
  <button class="control" id="cambioCamara">🔄 Cámara frontal</button>
  <div id="mensaje"></div>
  <div class="camera-controls">
    <button id="capture" aria-label="Sacar foto"></button>
  </div>
</section>

<section id="preview">
  <img id="previewImg" alt="Vista previa de la foto">
  <div class="previewButtons">
    <button class="btn btn-secondary" id="descartar">DESCARTAR</button>
    <button class="btn btn-primary" id="guardarFoto">💾 GUARDAR EN GOOGLE DRIVE</button>
  </div>
</section>

<div class="modal-bg" id="modalClave">
  <div class="modal">
    <h2>Galería privada</h2>
    <p>Ingresá la contraseña para ver las fotos.</p>
    <input id="clave" type="password" autocomplete="off" placeholder="Contraseña">
    <div id="errorClave">Contraseña incorrecta</div>
    <button class="btn btn-primary" id="ingresar">INGRESAR</button>
    <button class="btn btn-secondary" id="cancelarClave">CANCELAR</button>
  </div>
</div>

<section id="galeria">
  <div id="sinFotos">Cargando fotos…</div>
  <img id="fotoActual" alt="Foto del evento">
  <img id="qr" alt="QR de la foto">
  <div id="contador"></div>
  <button id="cerrarGaleria">×</button>
  <button class="flecha" id="prev">‹</button>
  <button class="flecha" id="next">›</button>
</section>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOKKJUMrNJvU9l4tRIPuaeF4H8k8-czm74NpXlyc9rpSV0T1BqgwRAdcAufHAey0GZSA/exec";
const PASSWORD = "disfrutalareunion";
const JPEG_QUALITY = 0.98;

const inicio = document.getElementById("inicio");
const camara = document.getElementById("camara");
const video = document.getElementById("video");
const capture = document.getElementById("capture");
const mensaje = document.getElementById("mensaje");
const cambioCamara = document.getElementById("cambioCamara");
const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");
const galeria = document.getElementById("galeria");
const fotoActual = document.getElementById("fotoActual");
const qr = document.getElementById("qr");
const contador = document.getElementById("contador");

let stream = null;
let facingMode = "environment";
let fotos = [];
let indice = 0;
let timer = null;
let logoImage = null;
let fotoOriginalPendiente = null;
let fotoLogoPendiente = null;

function mostrarMensaje(texto, tiempo=2200){
  mensaje.textContent = texto;
  mensaje.style.display = "block";
  clearTimeout(mostrarMensaje.t);
  mostrarMensaje.t = setTimeout(()=>mensaje.style.display="none", tiempo);
}

async function iniciarCamara(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:facingMode},
        width:{ideal:3840},
        height:{ideal:2160}
      },
      audio:false
    });

    video.srcObject = stream;
    await video.play();

    cambioCamara.textContent = facingMode === "environment"
      ? "🔄 Cámara frontal"
      : "🔄 Cámara trasera";

  }catch(e){
    mostrarMensaje("No se pudo acceder a la cámara.",3500);
  }
}

document.getElementById("sacarFoto").onclick = async ()=>{
  inicio.style.display="none";
  camara.style.display="flex";
  await iniciarCamara();
};

document.getElementById("volver").onclick = ()=>{
  if(stream) stream.getTracks().forEach(t=>t.stop());
  camara.style.display="none";
  inicio.style.display="flex";
};

cambioCamara.onclick = async ()=>{
  facingMode = facingMode === "environment" ? "user" : "environment";
  await iniciarCamara();
};

function cargarLogo(){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload=()=>{logoImage=img;resolve(img)};
    img.onerror=()=>resolve(null);
    img.src="logo.png";
  });
}

capture.onclick = async ()=>{
  if(!video.videoWidth || !video.videoHeight) return;

  const canvas=document.createElement("canvas");
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const ctx=canvas.getContext("2d",{alpha:false});
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  fotoOriginalPendiente=canvas.toDataURL("image/jpeg",JPEG_QUALITY);

  if(!logoImage) await cargarLogo();

  if(logoImage){
    const escala=Math.min(
      canvas.width*0.24/logoImage.naturalWidth,
      canvas.height*0.24/logoImage.naturalHeight,
      1
    );

    const w=logoImage.naturalWidth*escala;
    const h=logoImage.naturalHeight*escala;
    const margen=Math.round(Math.min(canvas.width,canvas.height)*0.025);

    ctx.drawImage(
      logoImage,
      canvas.width-w-margen,
      canvas.height-h-margen,
      w,
      h
    );
  }

  fotoLogoPendiente=canvas.toDataURL("image/jpeg",JPEG_QUALITY);

  previewImg.src=fotoLogoPendiente;
  camara.style.display="none";
  preview.style.display="flex";

  if(stream) stream.getTracks().forEach(t=>t.stop());
};

document.getElementById("descartar").onclick=()=>{
  fotoOriginalPendiente=null;
  fotoLogoPendiente=null;
  preview.style.display="none";
  camara.style.display="flex";
  iniciarCamara();
};

document.getElementById("guardarFoto").onclick=async ()=>{
  if(!fotoOriginalPendiente || !fotoLogoPendiente) return;

  const boton=document.getElementById("guardarFoto");
  boton.disabled=true;
  boton.textContent="GUARDANDO…";

  try{
    await fetch(SCRIPT_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({
        original:fotoOriginalPendiente,
        logo:fotoLogoPendiente
      })
    });

    boton.textContent="¡GUARDADA!";
    await new Promise(r=>setTimeout(r,900));

    fotoOriginalPendiente=null;
    fotoLogoPendiente=null;
    preview.style.display="none";
    inicio.style.display="flex";
    boton.disabled=false;
    boton.textContent="💾 GUARDAR EN GOOGLE DRIVE";

  }catch(e){
    boton.disabled=false;
    boton.textContent="💾 GUARDAR EN GOOGLE DRIVE";
    alert("No se pudo guardar la foto. Intentá nuevamente.");
  }
};

document.getElementById("verFotos").onclick=()=>{
  document.getElementById("modalClave").style.display="flex";
  document.getElementById("clave").value="";
  document.getElementById("errorClave").style.display="none";
  setTimeout(()=>document.getElementById("clave").focus(),100);
};

document.getElementById("cancelarClave").onclick=()=>{
  document.getElementById("modalClave").style.display="none";
};

document.getElementById("ingresar").onclick=validarClave;

document.getElementById("clave").addEventListener("keydown",e=>{
  if(e.key==="Enter") validarClave();
});

function validarClave(){
  if(document.getElementById("clave").value===PASSWORD){
    document.getElementById("modalClave").style.display="none";
    abrirGaleria();
  }else{
    document.getElementById("errorClave").style.display="block";
    document.getElementById("clave").select();
  }
}

async function abrirGaleria(){
  galeria.style.display="block";
  document.getElementById("sinFotos").style.display="flex";
  document.getElementById("sinFotos").textContent="Cargando fotos…";
  fotoActual.style.display="none";
  await cargarFotos();
}

function cargarFotos(){
  return new Promise(resolve=>{
    const callbackName="fotos_"+Date.now();

    window[callbackName]=function(data){
      fotos=Array.isArray(data)?data:[];
      indice=0;

      document.getElementById("sinFotos").style.display=
        fotos.length ? "none" : "flex";

      document.getElementById("sinFotos").textContent=
        fotos.length ? "" : "Todavía no hay fotos.";

      fotoActual.style.display=
        fotos.length ? "block" : "none";

      if(fotos.length) mostrarFoto(true);

      limpiar();
      resolve();
    };

    const script=document.createElement("script");
    script.src=SCRIPT_URL+"?callback="+encodeURIComponent(callbackName);

    script.onerror=()=>{
      document.getElementById("sinFotos").textContent=
        "No se pudieron cargar las fotos.";
      limpiar();
      resolve();
    };

    document.body.appendChild(script);

    function limpiar(){
      delete window[callbackName];
      script.remove();
    }
  });
}

function urlImagen(foto){
  // Thumbnail de Google Drive: suele ser más fiable para mostrar imágenes
  // que uc?export=view, especialmente en móviles.
  if(foto.id){
    return "https://drive.google.com/thumbnail?id="+encodeURIComponent(foto.id)+"&sz=w2400";
  }
  return foto.url;
}

function mostrarFoto(inmediata=false){
  if(!fotos.length)return;

  const foto=fotos[indice];
  const nuevaUrl=urlImagen(foto);

  const cambiar=()=>{
    fotoActual.src=nuevaUrl;

    qr.src=
      "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="+
      encodeURIComponent(foto.url || nuevaUrl);

    contador.textContent=(indice+1)+" / "+fotos.length;
    fotoActual.style.opacity="1";
  };

  if(inmediata){
    cambiar();
  }else{
    fotoActual.style.opacity="0";
    setTimeout(cambiar,400);
  }

  reiniciarTimer();
}

function siguiente(){
  if(!fotos.length)return;
  indice=(indice+1)%fotos.length;
  mostrarFoto();
}

function anterior(){
  if(!fotos.length)return;
  indice=(indice-1+fotos.length)%fotos.length;
  mostrarFoto();
}

function reiniciarTimer(){
  clearInterval(timer);
  if(fotos.length>1) timer=setInterval(siguiente,6000);
}

document.getElementById("next").onclick=siguiente;
document.getElementById("prev").onclick=anterior;

document.getElementById("cerrarGaleria").onclick=()=>{
  clearInterval(timer);
  galeria.style.display="none";
};

document.addEventListener("keydown",e=>{
  if(galeria.style.display==="block"){
    if(e.key==="ArrowRight")siguiente();
    if(e.key==="ArrowLeft")anterior();
    if(e.key==="Escape")document.getElementById("cerrarGaleria").click();
  }
});
</script>

</body>
</html>
