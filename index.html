<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Feliz Fest 2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}
body{overflow:hidden}
button{font:inherit}

#inicio,#camara{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#inicio{gap:18px;padding:24px}
#inicio img{max-width:220px;max-height:180px;object-fit:contain;margin-bottom:20px}
.btn{border:0;border-radius:16px;padding:18px 28px;width:min(330px,88vw);font-size:20px;font-weight:700;cursor:pointer}
.btn-primary{background:#fff;color:#111}
.btn-secondary{background:#333;color:#fff;border:1px solid #666}

#camara{display:none;position:relative;background:#000}
#video{width:100%;height:100%;object-fit:cover}
#video.selfie{transform:scaleX(-1)}
.camera-controls{position:absolute;left:0;right:0;bottom:0;padding:18px;display:flex;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.control{border:0;border-radius:999px;padding:13px 18px;background:rgba(255,255,255,.92);color:#111;font-weight:700;cursor:pointer}
#capture{width:76px;height:76px;border-radius:50%;padding:0;border:6px solid #fff;background:#ddd}
#volver{position:absolute;top:18px;left:18px;z-index:5}
#cambioCamara{position:absolute;top:18px;right:18px;z-index:5}
#panelCamara{position:absolute;left:12px;right:12px;bottom:112px;z-index:6;margin:auto;width:min(520px,calc(100% - 24px));padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.68);backdrop-filter:blur(8px);display:grid;grid-template-columns:1fr 1fr;gap:9px 14px}
#panelCamara label{font-size:12px;color:#eee;display:flex;flex-direction:column;gap:5px}
#panelCamara select{width:100%;padding:8px;border:1px solid #777;border-radius:8px;background:#222;color:#fff;font-size:13px}
#panelCamara input[type=range]{width:100%;accent-color:#fff}
#panelCamara .ancho{grid-column:1/-1}
#estadoCamara{font-size:11px;color:#ccc;grid-column:1/-1;text-align:center}
@media(max-height:620px){#panelCamara{bottom:95px;padding:7px 10px;gap:5px 10px}#panelCamara label{font-size:10px}}

#mensaje{position:absolute;left:50%;bottom:115px;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:12px 18px;border-radius:12px;display:none;text-align:center;z-index:10;white-space:nowrap}

#preview{display:none;position:fixed;inset:0;background:#000;z-index:15;flex-direction:column;align-items:center;justify-content:center}
#previewImg{width:100%;height:calc(100% - 115px);object-fit:contain}
.previewButtons{height:115px;width:100%;display:flex;justify-content:center;align-items:center;gap:12px;padding:15px;background:linear-gradient(transparent,#000)}
.previewButtons .btn{width:auto;min-width:150px;padding:15px 20px;font-size:16px}

#galeria{display:none;position:fixed;inset:0;background:#000;z-index:20}
#fotoActual{width:100%;height:100%;object-fit:contain;opacity:1;transition:opacity .8s ease}
#qr{position:absolute;top:18px;right:18px;width:92px;height:92px;background:#fff;padding:5px;border-radius:8px}
#cerrarGaleria{position:absolute;bottom:14px;left:14px;top:auto;background:transparent;color:rgba(55,55,55,.28);border:0;border-radius:0;width:32px;height:32px;padding:0;cursor:pointer;font-size:22px;line-height:32px;opacity:.55;transition:color .18s ease,opacity .18s ease}
#cerrarGaleria:hover,#cerrarGaleria:active{color:rgba(150,150,150,.95)}
#girarGaleria{position:absolute;bottom:14px;left:52px;top:auto;background:transparent;color:rgba(55,55,55,.28);border:0;border-radius:0;width:32px;height:32px;padding:0;cursor:pointer;font-size:21px;line-height:32px;opacity:.55;transition:color .18s ease,opacity .18s ease;z-index:5}
#cerrarGaleria:hover,#cerrarGaleria:active,#girarGaleria:hover,#girarGaleria:active{color:rgba(175,175,175,.9);opacity:.9}
#galeria.rotada90{transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center;width:100vh;height:100vw;top:50%;left:50%;right:auto;bottom:auto}
#galeria.rotada180{transform:translate(-50%,-50%) rotate(180deg);transform-origin:center center;width:100vw;height:100vh;top:50%;left:50%;right:auto;bottom:auto}
#galeria.rotada270{transform:translate(-50%,-50%) rotate(270deg);transform-origin:center center;width:100vh;height:100vw;top:50%;left:50%;right:auto;bottom:auto}
#galeria.rotada90 #girarGaleria{transform:rotate(-90deg)}
#galeria.rotada180 #girarGaleria{transform:rotate(-180deg)}
#galeria.rotada270 #girarGaleria{transform:rotate(-270deg)}
#contador{position:absolute;top:13px;left:43px;background:rgba(35,35,35,.10);padding:3px 5px;border-radius:5px;font-size:10px;color:rgba(45,45,45,.4);opacity:.35}
.flecha{position:absolute;top:50%;transform:translateY(-50%);background:rgba(35,35,35,.16);border:0;color:rgba(45,45,45,.38);font-size:18px;width:24px;height:34px;padding:0;line-height:34px;cursor:pointer;opacity:.18;transition:opacity .25s,background .25s}
.flecha:hover,.flecha:active{opacity:.5;background:rgba(35,35,35,.3)}
#prev{left:2px}#next{right:2px}
#sinFotos{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:2}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.modal{background:#fff;color:#111;border-radius:18px;padding:26px;width:min(380px,92vw);text-align:center}
.modal h2{margin-top:0}
.modal input{width:100%;padding:14px;border:1px solid #bbb;border-radius:10px;font-size:18px;margin:10px 0 14px}
.modal .btn{width:100%;margin-top:8px}
#errorClave{color:#c00;display:none;margin:5px 0 10px}
</style>
</head>
<body>

<section id="inicio">
  <img src="logo.png" alt="Logo del evento" onerror="this.style.display='none'">
  <button class="btn btn-primary" id="sacarFoto">📸 SACAR FOTO</button>
  <button class="btn btn-secondary" id="verFotos">🖼️ VER FOTOS</button>
</section>

<section id="camara">
  <video id="video" autoplay playsinline muted></video>
  <button class="control" id="volver">← Volver</button>
  <button class="control" id="cambioCamara">🔄 Cámara frontal</button>
  <div id="panelCamara">
    <label class="ancho">Cámara / lente
      <select id="selectorCamara"><option value="">Detectando cámaras…</option></select>
    </label>
    <label>Zoom <span id="valorZoom">1x</span>
      <input id="controlZoom" type="range" min="1" max="1" step="0.1" value="1" disabled>
    </label>
    <label>Modo de enfoque
      <select id="modoEnfoque"><option value="auto">Automático</option></select>
    </label>
    <label class="ancho" id="grupoEnfoqueManual" style="display:none">Enfoque manual <span id="valorEnfoque">—</span>
      <input id="controlEnfoque" type="range" min="0" max="1" step="0.01" value="0.5">
    </label>
    <div id="estadoCamara">Se habilitan los controles que admite este celular.</div>
  </div>
  <div id="mensaje"></div>
  <div class="camera-controls">
    <button id="capture" aria-label="Sacar foto"></button>
  </div>
</section>

<section id="preview">
  <img id="previewImg" alt="Vista previa de la foto">
  <div class="previewButtons">
    <button class="btn btn-secondary" id="descartar">NO GUARDAR</button>
    <button class="btn btn-primary" id="guardarFoto">SÍ, GUARDAR</button>
  </div>
</section>

<div class="modal-bg" id="modalClave">
  <div class="modal">
    <h2>Galería privada</h2>
    <p>Ingresá la contraseña para ver las fotos.</p>
    <input id="clave" type="password" autocomplete="off" placeholder="Contraseña">
    <div id="errorClave">Contraseña incorrecta</div>
    <button class="btn btn-primary" id="ingresar">INGRESAR</button>
    <button class="btn btn-secondary" id="cancelarClave">CANCELAR</button>
  </div>
</div>

<section id="galeria">
  <div id="sinFotos">Cargando fotos…</div>
  <img id="fotoActual" alt="Foto del evento">
  <img id="qr" alt="QR de la foto">
  <div id="contador"></div>
  <button id="cerrarGaleria">×</button>
  <button id="girarGaleria" aria-label="Girar galería">↻</button>
  <button class="flecha" id="prev">‹</button>
  <button class="flecha" id="next">›</button>
</section>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOKKJUMrNJvU9l4tRIPuaeF4H8k8-czm74NpXlyc9rpSV0T1BqgwRAdcAufHAey0GZSA/exec";
const PASSWORD = "1345";
const JPEG_QUALITY = 0.98;

const inicio = document.getElementById("inicio");
const camara = document.getElementById("camara");
const video = document.getElementById("video");
const capture = document.getElementById("capture");
const mensaje = document.getElementById("mensaje");
const cambioCamara = document.getElementById("cambioCamara");
const selectorCamara = document.getElementById("selectorCamara");
const controlZoom = document.getElementById("controlZoom");
const valorZoom = document.getElementById("valorZoom");
const modoEnfoque = document.getElementById("modoEnfoque");
const grupoEnfoqueManual = document.getElementById("grupoEnfoqueManual");
const controlEnfoque = document.getElementById("controlEnfoque");
const valorEnfoque = document.getElementById("valorEnfoque");
const estadoCamara = document.getElementById("estadoCamara");
const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");
const galeria = document.getElementById("galeria");
const fotoActual = document.getElementById("fotoActual");
const qr = document.getElementById("qr");
const contador = document.getElementById("contador");
const girarGaleria = document.getElementById("girarGaleria");

let stream = null;
let facingMode = "environment";
let selectedDeviceId = "";
let capacidadesCamara = {};
let modosEnfoqueDisponibles = [];
let fotos = [];
let indice = 0;
let timer = null;
let refreshTimer = null;
let logoImage = null;
let fotoOriginalPendiente = null;
let fotoLogoPendiente = null;
let galeriaRotada = 0;

function mostrarMensaje(texto, tiempo=2200){
  mensaje.textContent = texto;
  mensaje.style.display = "block";
  clearTimeout(mostrarMensaje.t);
  mostrarMensaje.t = setTimeout(()=>mensaje.style.display="none", tiempo);
}

async function listarCamaras(){
  try{
    const dispositivos=await navigator.mediaDevices.enumerateDevices();
    const camaras=dispositivos.filter(d=>d.kind==="videoinput");
    const actual=selectedDeviceId;
    selectorCamara.innerHTML="";
    camaras.forEach((camara,i)=>{
      const opcion=document.createElement("option");
      opcion.value=camara.deviceId;
      opcion.textContent=camara.label || `Cámara ${i+1}`;
      selectorCamara.appendChild(opcion);
    });
    if(actual && camaras.some(c=>c.deviceId===actual)) selectorCamara.value=actual;
    else if(camaras.length) selectorCamara.value=camaras[0].deviceId;
    selectorCamara.disabled=camaras.length<2;
    if(!camaras.length) selectorCamara.innerHTML='<option value="">No se detectaron cámaras</option>';
  }catch(e){
    selectorCamara.innerHTML='<option value="">Selección no disponible</option>';
  }
}

async function configurarControlesCamara(pista){
  capacidadesCamara={};
  modosEnfoqueDisponibles=[];
  const ajustes=pista.getCapabilities ? pista.getCapabilities() : {};
  capacidadesCamara=ajustes;
  estadoCamara.textContent="Controles disponibles según el celular y el navegador.";

  // Zoom óptico/digital expuesto por el navegador.
  if(ajustes.zoom){
    controlZoom.min=ajustes.zoom.min;
    controlZoom.max=ajustes.zoom.max;
    controlZoom.step=ajustes.zoom.step || 0.1;
    const actual=pista.getSettings ? pista.getSettings().zoom : ajustes.zoom.min;
    controlZoom.value=actual || ajustes.zoom.min;
    controlZoom.disabled=false;
    actualizarTextoZoom();
  }else{
    controlZoom.min=1;controlZoom.max=1;controlZoom.value=1;controlZoom.disabled=true;
    valorZoom.textContent="No disponible";
  }

  modoEnfoque.innerHTML="";
  modoEnfoque.disabled=false;
  if(ajustes.focusMode && ajustes.focusMode.length){
    modosEnfoqueDisponibles=ajustes.focusMode;
    const nombres={continuous:"Automático continuo","single-shot":"Automático al capturar",manual:"Manual"};
    ajustes.focusMode.forEach(modo=>{
      const op=document.createElement("option");op.value=modo;op.textContent=nombres[modo] || modo;modoEnfoque.appendChild(op);
    });
    const preferido=ajustes.focusMode.includes("continuous")?"continuous":ajustes.focusMode[0];
    modoEnfoque.value=preferido;
    await aplicarModoEnfoque(preferido);
  }else{
    const op=document.createElement("option");op.value="auto";op.textContent="Automático del dispositivo";modoEnfoque.appendChild(op);
    modoEnfoque.disabled=true;
    estadoCamara.textContent="El navegador no expone controles manuales de enfoque para esta cámara.";
  }
  const tieneManual=ajustes.focusMode?.includes("manual") && ajustes.focusDistance;
  grupoEnfoqueManual.style.display=tieneManual?"flex":"none";
  if(tieneManual){
    controlEnfoque.min=ajustes.focusDistance.min;
    controlEnfoque.max=ajustes.focusDistance.max;
    controlEnfoque.step=ajustes.focusDistance.step || 0.01;
    controlEnfoque.value=(ajustes.focusDistance.min+ajustes.focusDistance.max)/2;
    actualizarTextoEnfoque();
  }
}

function actualizarTextoZoom(){valorZoom.textContent=`${Number(controlZoom.value).toFixed(1)}x`;}
function actualizarTextoEnfoque(){valorEnfoque.textContent=Number(controlEnfoque.value).toFixed(2);}

async function aplicarModoEnfoque(modo){
  const pista=stream?.getVideoTracks()[0];if(!pista)return;
  try{
    if(modo!=="auto") await pista.applyConstraints({advanced:[{focusMode:modo}]});
    grupoEnfoqueManual.style.display=(modo==="manual" && capacidadesCamara.focusDistance)?"flex":"none";
    if(modo==="manual" && capacidadesCamara.focusDistance){
      await pista.applyConstraints({advanced:[{focusDistance:Number(controlEnfoque.value)}]});
    }
  }catch(e){console.log("Este dispositivo no admite ese modo de enfoque",e);}
}

async function iniciarCamara(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    const videoConstraint={width:{ideal:3840},height:{ideal:2160}};
    if(selectedDeviceId) videoConstraint.deviceId={exact:selectedDeviceId};
    else videoConstraint.facingMode={ideal:facingMode};
    stream=await navigator.mediaDevices.getUserMedia({video:videoConstraint,audio:false});
    video.srcObject=stream;
    const pista=stream.getVideoTracks()[0];
    const settings=pista.getSettings ? pista.getSettings() : {};
    if(settings.facingMode) facingMode=settings.facingMode;
    video.classList.toggle("selfie",facingMode==="user");
    await video.play();
    await listarCamaras();
    if(settings.deviceId){selectedDeviceId=settings.deviceId;selectorCamara.value=settings.deviceId;}
    await configurarControlesCamara(pista);
    cambioCamara.textContent=facingMode==="environment"?"🔄 Cámara frontal":"🔄 Cámara trasera";
  }catch(e){
    console.error("No se pudo iniciar la cámara",e);
    mostrarMensaje("No se pudo acceder a la cámara.",3500);
  }
}

selectorCamara.onchange=async()=>{
  selectedDeviceId=selectorCamara.value;
  const opcion=selectorCamara.options[selectorCamara.selectedIndex]?.textContent.toLowerCase() || "";
  facingMode=(opcion.includes("front")||opcion.includes("frontal")||opcion.includes("user"))?"user":"environment";
  await iniciarCamara();
};

controlZoom.oninput=async()=>{
  actualizarTextoZoom();
  const pista=stream?.getVideoTracks()[0];if(!pista)return;
  try{await pista.applyConstraints({advanced:[{zoom:Number(controlZoom.value)}]});}catch(e){console.log("Zoom no disponible",e);}
};

modoEnfoque.onchange=()=>aplicarModoEnfoque(modoEnfoque.value);
controlEnfoque.oninput=async()=>{
  actualizarTextoEnfoque();
  const pista=stream?.getVideoTracks()[0];if(!pista)return;
  try{await pista.applyConstraints({advanced:[{focusMode:"manual"},{focusDistance:Number(controlEnfoque.value)}]});}catch(e){console.log("Enfoque manual no disponible",e);}
};

document.getElementById("sacarFoto").onclick = async ()=>{
  inicio.style.display="none";
  camara.style.display="flex";
  await iniciarCamara();
};

document.getElementById("volver").onclick = ()=>{
  if(stream) stream.getTracks().forEach(t=>t.stop());
  camara.style.display="none";
  inicio.style.display="flex";
};

cambioCamara.onclick = async ()=>{
  facingMode = facingMode === "environment" ? "user" : "environment";
  selectedDeviceId = "";
  await iniciarCamara();
};

function cargarLogo(){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload=()=>{logoImage=img;resolve(img)};
    img.onerror=()=>resolve(null);
    img.src="logo.png";
  });
}

// Convierte el archivo original de la cámara a Data URL para enviarlo a Drive.
function blobADataURL(blob){
  return new Promise((resolve,reject)=>{
    const lector=new FileReader();
    lector.onload=()=>resolve(lector.result);
    lector.onerror=()=>reject(lector.error);
    lector.readAsDataURL(blob);
  });
}

capture.onclick = async ()=>{
  if(!video.videoWidth || !video.videoHeight) return;
  capture.disabled=true;
  mostrarMensaje("Tomando fotografía…",3000);

  let imagenCapturada=null;
  try{
    const pista=stream && stream.getVideoTracks()[0];

    // En navegadores compatibles, toma una fotografía fija directamente del sensor.
    if(pista && "ImageCapture" in window){
      try{
        const capturador=new ImageCapture(pista);
        const archivoFoto=await capturador.takePhoto();
        fotoOriginalPendiente=await blobADataURL(archivoFoto);
        imagenCapturada=await createImageBitmap(archivoFoto);
      }catch(errorCapturaNativa){
        console.log("Captura fija no disponible; se usará la vista previa.",errorCapturaNativa);
      }
    }

    // Alternativa compatible con celulares/navegadores sin ImageCapture.
    if(!imagenCapturada){
      const respaldo=document.createElement("canvas");
      respaldo.width=video.videoWidth;
      respaldo.height=video.videoHeight;
      respaldo.getContext("2d",{alpha:false}).drawImage(video,0,0,respaldo.width,respaldo.height);
      fotoOriginalPendiente=respaldo.toDataURL("image/jpeg",JPEG_QUALITY);
      imagenCapturada=await createImageBitmap(respaldo);
    }

    const canvas=document.createElement("canvas");
    canvas.width=imagenCapturada.width;
    canvas.height=imagenCapturada.height;
    const ctx=canvas.getContext("2d",{alpha:false});
    ctx.drawImage(imagenCapturada,0,0,canvas.width,canvas.height);
    if(imagenCapturada.close) imagenCapturada.close();

    if(!logoImage) await cargarLogo();
    if(logoImage){
      const escala=Math.min(
        canvas.width*0.1944/logoImage.naturalWidth,
        canvas.height*0.1944/logoImage.naturalHeight,
        1
      );
      const w=logoImage.naturalWidth*escala;
      const h=logoImage.naturalHeight*escala;
      const margen=Math.round(Math.min(canvas.width,canvas.height)*0.025);
      ctx.drawImage(logoImage,canvas.width-w-margen,canvas.height-h-margen,w,h);
    }

    fotoLogoPendiente=canvas.toDataURL("image/jpeg",JPEG_QUALITY);
    previewImg.src=fotoLogoPendiente;
    camara.style.display="none";
    preview.style.display="flex";
    if(stream) stream.getTracks().forEach(t=>t.stop());
  }catch(error){
    console.error("Error al procesar la fotografía:",error);
    mostrarMensaje("No se pudo procesar la foto. Intentá nuevamente.",3500);
  }finally{
    capture.disabled=false;
  }
};

document.getElementById("descartar").onclick=()=>{
  fotoOriginalPendiente=null;
  fotoLogoPendiente=null;
  preview.style.display="none";
  camara.style.display="flex";
  iniciarCamara();
};

document.getElementById("guardarFoto").onclick=async ()=>{
  if(!fotoOriginalPendiente || !fotoLogoPendiente) return;

  const boton=document.getElementById("guardarFoto");
  boton.disabled=true;
  boton.textContent="GUARDANDO…";

  try{
    await fetch(SCRIPT_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({
        original:fotoOriginalPendiente,
        logo:fotoLogoPendiente
      })
    });

    boton.textContent="¡GUARDADA!";
    await new Promise(r=>setTimeout(r,900));

    fotoOriginalPendiente=null;
    fotoLogoPendiente=null;
    preview.style.display="none";
    inicio.style.display="flex";
    boton.disabled=false;
    boton.textContent="SÍ, GUARDAR";

  }catch(e){
    boton.disabled=false;
    boton.textContent="SÍ, GUARDAR";
    alert("No se pudo guardar la foto. Intentá nuevamente.");
  }
};

document.getElementById("verFotos").onclick=()=>{
  document.getElementById("modalClave").style.display="flex";
  document.getElementById("clave").value="";
  document.getElementById("errorClave").style.display="none";
  setTimeout(()=>document.getElementById("clave").focus(),100);
};

document.getElementById("cancelarClave").onclick=()=>{
  document.getElementById("modalClave").style.display="none";
};

document.getElementById("ingresar").onclick=validarClave;

document.getElementById("clave").addEventListener("keydown",e=>{
  if(e.key==="Enter") validarClave();
});

function validarClave(){
  if(document.getElementById("clave").value===PASSWORD){
    document.getElementById("modalClave").style.display="none";
    abrirGaleria();
  }else{
    document.getElementById("errorClave").style.display="block";
    document.getElementById("clave").select();
  }
}

async function abrirGaleria(){
  galeria.style.display="block";
  document.getElementById("sinFotos").style.display="flex";
  document.getElementById("sinFotos").textContent="Cargando fotos…";
  fotoActual.style.display="none";
  await cargarFotos(false);
  iniciarActualizacionGaleria();
}

function cargarFotos(mantenerFoto=true){
  return new Promise(resolve=>{
    const idActual = mantenerFoto && fotos[indice] ? fotos[indice].id : null;
    const requestId="req_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const iframe=document.createElement("iframe");

    iframe.style.display="none";
    iframe.setAttribute("aria-hidden","true");

    let terminado=false;

    const limpiar=()=>{
      if(terminado)return;
      terminado=true;
      window.removeEventListener("message",recibir);
      clearTimeout(temporizador);
      iframe.remove();
      resolve();
    };

    const recibir=(event)=>{
      const data=event.data;

      if(!data || data.type!=="FELIZFEST_FOTOS" || data.requestId!==requestId){
        return;
      }

      const nuevasFotos=Array.isArray(data.fotos)?data.fotos:[];
      const idsNuevos=nuevasFotos.map(f=>f.id).join(",");
      const idsActuales=fotos.map(f=>f.id).join(",");
      const cambio=idsNuevos!==idsActuales;

      if(cambio){
        fotos=nuevasFotos;

        if(fotos.length){
          let nuevoIndice=0;

          if(idActual){
            const encontrada=fotos.findIndex(f=>f.id===idActual);
            if(encontrada>=0){
              nuevoIndice=encontrada;
            }else{
              nuevoIndice=Math.min(indice,fotos.length-1);
            }
          }

          indice=nuevoIndice;
          document.getElementById("sinFotos").style.display="none";
          fotoActual.style.display="block";

          if(!idActual || !fotos.some(f=>f.id===idActual)){
            mostrarFoto(true);
          }else{
            contador.textContent=(indice+1)+" / "+fotos.length;
          }
        }else{
          document.getElementById("sinFotos").style.display="flex";
          document.getElementById("sinFotos").textContent="Todavía no hay fotos.";
          fotoActual.style.display="none";
        }
      }else if(fotos.length){
        contador.textContent=(indice+1)+" / "+fotos.length;
      }

      limpiar();
    };

    window.addEventListener("message",recibir);

    const temporizador=setTimeout(()=>{
      if(!fotos.length){
        document.getElementById("sinFotos").textContent="No se pudieron cargar las fotos.";
      }
      limpiar();
    },10000);

    iframe.src=SCRIPT_URL+"?modo=galeria&requestId="+encodeURIComponent(requestId)+"&t="+Date.now();
    document.body.appendChild(iframe);
  });
}

function iniciarActualizacionGaleria(){
  clearInterval(refreshTimer);

  // Revisa periódicamente Google Drive mientras el carrusel está abierto.
  // Si aparece una foto nueva, se incorpora sin recargar la página.
  refreshTimer=setInterval(()=>{
    if(galeria.style.display==="block"){
      cargarFotos(true);
    }
  },3000);
}

function urlsImagen(foto){
  const urls=[];

  if(foto.id){
    // Google Drive recomienda la URL de thumbnail para mostrar imágenes
    // en páginas externas. Probamos primero una resolución grande.
    urls.push(
      "https://drive.google.com/thumbnail?id="+encodeURIComponent(foto.id)+"&sz=s4000"
    );

    // Segundo intento por si el thumbnail anterior no responde en el navegador.
    urls.push(
      "https://lh3.googleusercontent.com/d/"+encodeURIComponent(foto.id)+"=w2400"
    );
  }

  if(foto.url) urls.push(foto.url);

  return urls;
}

function mostrarFoto(inmediata=false){
  if(!fotos.length)return;

  const foto=fotos[indice];
  const urls=urlsImagen(foto);

  const cargarConFallback=(pos=0)=>{
    if(!urls.length){
      fotoActual.style.display="none";
      document.getElementById("sinFotos").style.display="flex";
      document.getElementById("sinFotos").textContent="No se pudo mostrar esta foto.";
      return;
    }

    const url=urls[pos];
    const prueba=new Image();

    prueba.onload=()=>{
      fotoActual.src=url;
      fotoActual.style.display="block";
      document.getElementById("sinFotos").style.display="none";
      contador.textContent=(indice+1)+" / "+fotos.length;
      fotoActual.style.opacity="1";
    };

    prueba.onerror=()=>{
      if(pos+1<urls.length){
        cargarConFallback(pos+1);
      }else{
        fotoActual.style.display="none";
        document.getElementById("sinFotos").style.display="flex";
        document.getElementById("sinFotos").textContent="No se pudo mostrar esta foto.";
      }
    };

    prueba.src=url;
  };

  const cambiar=()=>{
    cargarConFallback(0);

    qr.src=
      "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="+
      encodeURIComponent(foto.url || urls[0] || "");
  };

  if(inmediata){
    cambiar();
  }else{
    fotoActual.style.opacity="0";
    setTimeout(cambiar,400);
  }

  reiniciarTimer();
}

function siguiente(){
  if(!fotos.length)return;
  indice=(indice+1)%fotos.length;
  mostrarFoto();
}

function anterior(){
  if(!fotos.length)return;
  indice=(indice-1+fotos.length)%fotos.length;
  mostrarFoto();
}

function reiniciarTimer(){
  clearInterval(timer);
  if(fotos.length>1) timer=setInterval(siguiente,6000);
}


girarGaleria.onclick=()=>{
  galeriaRotada=(galeriaRotada+90)%360;
  galeria.classList.remove("rotada90","rotada180","rotada270");
  if(galeriaRotada===90) galeria.classList.add("rotada90");
  if(galeriaRotada===180) galeria.classList.add("rotada180");
  if(galeriaRotada===270) galeria.classList.add("rotada270");
};

document.getElementById("next").onclick=siguiente;
document.getElementById("prev").onclick=anterior;

document.getElementById("cerrarGaleria").onclick=()=>{
  clearInterval(timer);
  clearInterval(refreshTimer);
  galeria.style.display="none";
  galeriaRotada=0;
  galeria.classList.remove("rotada90","rotada180","rotada270");
};

document.addEventListener("keydown",e=>{
  if(galeria.style.display==="block"){
    if(e.key==="ArrowRight")siguiente();
    if(e.key==="ArrowLeft")anterior();
    if(e.key==="Escape")document.getElementById("cerrarGaleria").click();
  }
});
</script>
