<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fotos del Evento</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    header {
      background: #000;
      padding: 20px 15px 25px;
    }

    header img {
      max-width: 180px;
      max-height: 120px;
      object-fit: contain;
      display: block;
      margin: 0 auto 15px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitulo {
      color: #aaa;
      margin-top: 12px;
      font-size: 16px;
    }

    .botones {
      background: #1c1c1c;
      padding: 20px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 15px 22px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #111;
      transition: transform 0.15s;
    }

    button:hover {
      transform: scale(1.03);
    }

    button:active {
      transform: scale(0.97);
    }

    .contenedor {
      max-width: 1000px;
      margin: auto;
      padding: 30px 15px;
    }

    #zonaCamara {
      display: none;
    }

    video {
      width: 100%;
      max-width: 700px;
      border-radius: 18px;
      background: #000;
      display: block;
      margin: 0 auto 15px;
    }

    canvas {
      display: none;
    }

    #fotoPreview {
      display: none;
      width: 100%;
      max-width: 700px;
      border-radius: 18px;
      margin: 0 auto 15px;
    }

    .controles-camara {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    #mensaje {
      min-height: 30px;
      margin: 20px auto;
      color: #ddd;
      font-size: 16px;
    }

    #galeria {
      margin-top: 25px;
    }

    .titulo-galeria {
      font-size: 25px;
      margin-bottom: 20px;
    }

    .grid-fotos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .foto-card {
      background: #1d1d1d;
      border-radius: 14px;
      padding: 10px;
      overflow: hidden;
    }

    .foto-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }

    .foto-botones {
      display: flex;
      gap: 7px;
      margin-top: 9px;
    }

    .foto-botones button {
      flex: 1;
      padding: 9px 5px;
      font-size: 13px;
      border-radius: 8px;
    }

    .estado {
      color: #999;
      padding: 30px 10px;
    }

    #modalQR {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .qr-contenido {
      background: white;
      color: #111;
      padding: 20px;
      border-radius: 18px;
      max-width: 420px;
      width: 100%;
    }

    .qr-contenido h2 {
      margin-top: 0;
    }

    #imagenQR {
      width: 100%;
      max-width: 350px;
      display: block;
      margin: 15px auto;
    }

    .cerrar {
      background: #111;
      color: white;
      width: 100%;
    }

    .oculto {
      display: none !important;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 23px;
      }

      button {
        width: 100%;
        max-width: 320px;
      }

      .botones {
        flex-direction: column;
        align-items: center;
      }

      .grid-fotos {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .foto-botones {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header>

    <!-- LOGO DEL EVENTO -->
    <img src="logo.png" alt="Logo del evento">

    <h1>📷 FOTOS DEL EVENTO</h1>

    <div class="subtitulo">
      Compartí y descargá tus fotos
    </div>

  </header>


  <!-- BOTONES PRINCIPALES -->

  <div class="botones">

    <button onclick="abrirCamara()">
      📷 SACAR UNA FOTO
    </button>

    <button onclick="mostrarGaleria()">
      🖼️ VER FOTOS
    </button>

  </div>


  <main class="contenedor">

    <!-- ========================= -->
    <!-- ZONA DE CÁMARA -->
    <!-- ========================= -->

    <section id="zonaCamara">

      <video id="video" autoplay playsinline></video>

      <canvas id="canvas"></canvas>

      <img id="fotoPreview" alt="Foto tomada">

      <div class="controles-camara">

        <button
          id="btnActivarCamara"
          onclick="iniciarCamara()">
          📷 ACTIVAR CÁMARA
        </button>

        <button
          id="btnSacarFoto"
          onclick="sacarFoto()"
          class="oculto">
          📸 SACAR FOTO
        </button>

        <button
          id="btnGuardar"
          onclick="subirFoto()"
          class="oculto">
          ☁️ GUARDAR EN GOOGLE DRIVE
        </button>

        <button
          id="btnNuevaFoto"
          onclick="nuevaFoto()"
          class="oculto">
          🔄 NUEVA FOTO
        </button>

        <button
          id="btnCerrarCamara"
          onclick="terminarCamara()"
          class="oculto">
          ❌ CERRAR CÁMARA
        </button>

      </div>

    </section>


    <!-- MENSAJES -->

    <div id="mensaje"></div>


    <!-- ========================= -->
    <!-- GALERÍA -->
    <!-- ========================= -->

    <section id="galeria">

      <div class="titulo-galeria">
        🖼️ GALERÍA
      </div>

      <div id="listaFotos" class="grid-fotos">

        <div class="estado">
          Cargando fotos...
        </div>

      </div>

    </section>

  </main>


  <!-- ========================= -->
  <!-- MODAL QR -->
  <!-- ========================= -->

  <div id="modalQR">

    <div class="qr-contenido">

      <h2>📱 Escaneá para ver la foto</h2>

      <img id="imagenQR" alt="Código QR">

      <button
        class="cerrar"
        onclick="cerrarQR()">
        CERRAR
      </button>

    </div>

  </div>


  <script>

    /* =====================================================
       CONFIGURACIÓN
       ===================================================== */

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyOKKJUMrNJvU9l4tRIPuaeF4H8k8-czm74NpXlyc9rpSV0T1BqgwRAdcAufHAey0GZSA/exec";


    /* =====================================================
       VARIABLES
       ===================================================== */

    let stream = null;

    let fotoOriginal = null;

    let fotoConLogo = null;

    let contadorJSONP = 0;


    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const video = document.getElementById("video");

    const canvas = document.getElementById("canvas");

    const fotoPreview = document.getElementById("fotoPreview");

    const zonaCamara = document.getElementById("zonaCamara");

    const mensaje = document.getElementById("mensaje");

    const listaFotos = document.getElementById("listaFotos");


    /* =====================================================
       MENSAJES
       ===================================================== */

    function mostrarMensaje(texto) {

      mensaje.textContent = texto;

    }


    /* =====================================================
       ABRIR CÁMARA
       ===================================================== */

    function abrirCamara() {

      zonaCamara.style.display = "block";

      document.getElementById("galeria").style.display = "none";

      mostrarMensaje("");

      window.scrollTo({
        top: zonaCamara.offsetTop - 20,
        behavior: "smooth"
      });

    }


    /* =====================================================
       INICIAR CÁMARA
       ===================================================== */

    async function iniciarCamara() {

      try {

        mostrarMensaje("Solicitando acceso a la cámara...");

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

          throw new Error(
            "Este navegador no permite acceder a la cámara."
          );

        }

        stream = await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            },
            width: {
              ideal: 1920
            },
            height: {
              ideal: 1080
            }
          },

          audio: false

        });


        video.srcObject = stream;

        video.style.display = "block";

        fotoPreview.style.display = "none";


        document
          .getElementById("btnActivarCamara")
          .classList.add("oculto");


        document
          .getElementById("btnSacarFoto")
          .classList.remove("oculto");


        document
          .getElementById("btnCerrarCamara")
          .classList.remove("oculto");


        mostrarMensaje(
          "Cámara activada. ¡Sonreí y sacá la foto! 📸"
        );

      } catch (error) {

        console.error(error);

        mostrarMensaje(
          "No se pudo activar la cámara. " +
          "Revisá que hayas permitido el acceso a la cámara."
        );

      }

    }


    /* =====================================================
       SACAR FOTO
       ===================================================== */

    async function sacarFoto() {

      if (!stream) {

        mostrarMensaje(
          "Primero tenés que activar la cámara."
        );

        return;

      }


      try {

        const anchoOriginal = video.videoWidth;

        const altoOriginal = video.videoHeight;


        if (!anchoOriginal || !altoOriginal) {

          mostrarMensaje(
            "Esperá un momento hasta que la cámara esté lista."
          );

          return;

        }


        /* -----------------------------------------------
           LIMITAR TAMAÑO PARA QUE EL ARCHIVO NO SEA
           DEMASIADO PESADO
           ----------------------------------------------- */

        const maxAncho = 1800;

        let ancho = anchoOriginal;

        let alto = altoOriginal;


        if (ancho > maxAncho) {

          alto =
            Math.round(alto * maxAncho / ancho);

          ancho = maxAncho;

        }


        canvas.width = ancho;

        canvas.height = alto;


        const contexto =
          canvas.getContext("2d");


        /* -----------------------------------------------
           FOTO ORIGINAL SIN LOGO
           ----------------------------------------------- */

        contexto.drawImage(
          video,
          0,
          0,
          ancho,
          alto
        );


        fotoOriginal =
          canvas.toDataURL(
            "image/jpeg",
            0.92
          );


        /* -----------------------------------------------
           FOTO CON LOGO
           ----------------------------------------------- */

        const imagenLogo =
          new Image();


        imagenLogo.onload = function () {

          try {

            /* Dibujamos nuevamente la foto */

            contexto.drawImage(
              video,
              0,
              0,
              ancho,
              alto
            );


            /* -----------------------------------------
               TAMAÑO DEL LOGO
               ----------------------------------------- */

            const margen = 25;

            const anchoLogo =
              Math.min(
                ancho * 0.25,
                350
              );


            const proporcion =
              imagenLogo.naturalHeight /
              imagenLogo.naturalWidth;


            const altoLogo =
              anchoLogo * proporcion;


            /* -----------------------------------------
               POSICIÓN:
               ABAJO A LA DERECHA
               ----------------------------------------- */

            const x =
              ancho -
              anchoLogo -
              margen;


            const y =
              alto -
              altoLogo -
              margen;


            contexto.drawImage(
              imagenLogo,
              x,
              y,
              anchoLogo,
              altoLogo
            );


            fotoConLogo =
              canvas.toDataURL(
                "image/jpeg",
                0.92
              );


            /* Mostrar la foto con logo */

            fotoPreview.src =
              fotoConLogo;

            fotoPreview.style.display =
              "block";


            video.style.display =
              "none";


            document
              .getElementById("btnSacarFoto")
              .classList.add("oculto");


            document
              .getElementById("btnGuardar")
              .classList.remove("oculto");


            mostrarMensaje(
              "Foto lista. Podés guardarla en Google Drive."
            );

          } catch (error) {

            console.error(error);

            mostrarMensaje(
              "La foto fue tomada pero hubo un problema con el logo."
            );

          }

        };


        imagenLogo.onerror = function () {

          console.warn(
            "No se pudo cargar logo.png"
          );


          /* Si falla el logo, usamos la foto original */

          fotoConLogo =
            fotoOriginal;


          fotoPreview.src =
            fotoOriginal;


          fotoPreview.style.display =
            "block";


          video.style.display =
            "none";


          document
            .getElementById("btnSacarFoto")
            .classList.add("oculto");


          document
            .getElementById("btnGuardar")
            .classList.remove("oculto");


          mostrarMensaje(
            "Foto lista. No se encontró el logo, por lo que se guardará sin logo."
          );

        };


        imagenLogo.src =
          "logo.png";


      } catch (error) {

        console.error(error);

        mostrarMensaje(
          "No se pudo tomar la foto."
        );

      }

    }


    /* =====================================================
       GUARDAR EN GOOGLE DRIVE
       ===================================================== */

    async function subirFoto() {

      if (!fotoOriginal || !fotoConLogo) {

        mostrarMensaje(
          "Primero tenés que sacar una foto."
        );

        return;

      }


      const boton =
        document.getElementById("btnGuardar");


      boton.disabled = true;

      boton.textContent =
        "⏳ GUARDANDO...";


      mostrarMensaje(
        "Guardando las fotos en Google Drive..."
      );


      try {

        await fetch(
          SCRIPT_URL,
          {
            method: "POST",

            mode: "no-cors",

            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              original: fotoOriginal,

              logo: fotoConLogo

            })

          }
        );


        /*
         * IMPORTANTE:
         *
         * no-cors no permite leer la respuesta
         * de Google Apps Script desde el navegador.
         *
         * Por eso no podemos confirmar desde acá
         * el resultado exacto del servidor.
         */


        mostrarMensaje(
          "✅ Foto enviada. Esperá unos segundos y aparecerá en la galería."
        );


        boton.classList.add("oculto");


        document
          .getElementById("btnNuevaFoto")
          .classList.remove("oculto");


        /*
         * Esperamos y actualizamos la galería.
         */

        setTimeout(
          cargarGaleria,
          4000
        );


      } catch (error) {

        console.error(error);

        mostrarMensaje(
          "❌ No se pudo enviar la foto. Revisá la conexión a Internet."
        );

      }


      boton.disabled = false;

      boton.textContent =
        "☁️ GUARDAR EN GOOGLE DRIVE";

    }


    /* =====================================================
       NUEVA FOTO
       ===================================================== */

    function nuevaFoto() {

      fotoOriginal = null;

      fotoConLogo = null;


      fotoPreview.src = "";

      fotoPreview.style.display =
        "none";


      video.style.display =
        "block";


      document
        .getElementById("btnNuevaFoto")
        .classList.add("oculto");


      document
        .getElementById("btnGuardar")
        .classList.add("oculto");


      document
        .getElementById("btnSacarFoto")
        .classList.remove("oculto");


      mostrarMensaje(
        "Podés sacar otra foto."
      );

    }


    /* =====================================================
       TERMINAR CÁMARA
       ===================================================== */

    function terminarCamara() {

      if (stream) {

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        stream = null;

      }


      video.srcObject = null;


      zonaCamara.style.display =
        "none";


      document
        .getElementById("galeria")
        .style.display =
        "block";


      document
        .getElementById("btnActivarCamara")
        .classList.remove("oculto");


      document
        .getElementById("btnSacarFoto")
        .classList.add("oculto");


      document
        .getElementById("btnGuardar")
        .classList.add("oculto");


      document
        .getElementById("btnNuevaFoto")
        .classList.add("oculto");


      document
        .getElementById("btnCerrarCamara")
        .classList.add("oculto");


      fotoOriginal = null;

      fotoConLogo = null;

    }


    /* =====================================================
       MOSTRAR GALERÍA
       ===================================================== */

    function mostrarGaleria() {

      document
        .getElementById("galeria")
        .style.display =
        "block";


      zonaCamara.style.display =
        "none";


      cargarGaleria();


      window.scrollTo({
        top:
          document
            .getElementById("galeria")
            .offsetTop - 20,

        behavior: "smooth"
      });

    }


    /* =====================================================
       CARGAR GALERÍA
       ===================================================== */

    function cargarGaleria() {

      if (!SCRIPT_URL ||
          SCRIPT_URL.indexOf("/exec") === -1) {

        listaFotos.innerHTML =
          '<div class="estado">Configuración de Apps Script incorrecta.</div>';

        return;

      }


      listaFotos.innerHTML =
        '<div class="estado">⏳ Cargando fotos...</div>';


      contadorJSONP++;

      const callbackName =
        "mostrarFotos_" +
        Date.now() +
        "_" +
        contadorJSONP;


      /*
       * Creamos una función global temporal.
       */

      window[callbackName] =
        function (fotos) {

          try {

            mostrarFotos(fotos);

          } catch (error) {

            console.error(error);

            listaFotos.innerHTML =
              '<div class="estado">No se pudo mostrar la galería.</div>';

          }


          /*
           * Eliminamos la función temporal.
           */

          try {

            delete window[callbackName];

          } catch (e) {}


        };


      const script =
        document.createElement("script");


      script.src =
        SCRIPT_URL +
        "?callback=" +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function () {

          console.error(
            "No se pudo conectar con Google Apps Script."
          );


          listaFotos.innerHTML =
            '<div class="estado">⚠️ No se pudo conectar con la galería.</div>';


          try {

            delete window[callbackName];

          } catch (e) {}

        };


      document
        .body
        .appendChild(script);


      /*
       * Limpiar el script después de unos segundos.
       */

      setTimeout(
        function () {

          if (script.parentNode) {

            script.parentNode.removeChild(
              script
            );

          }

        },
        10000
      );

    }


    /* =====================================================
       MOSTRAR FOTOS
       ===================================================== */

    function mostrarFotos(fotos) {

      if (!Array.isArray(fotos)) {

        listaFotos.innerHTML =
          '<div class="estado">No se recibieron fotos.</div>';

        return;

      }


      if (fotos.length === 0) {

        listaFotos.innerHTML =
          '<div class="estado">Todavía no hay fotos.</div>';

        return;

      }


      listaFotos.innerHTML = "";


      fotos.forEach(
        function (foto) {

          const tarjeta =
            document.createElement("div");


          tarjeta.className =
            "foto-card";


          const imagen =
            document.createElement("img");


          imagen.src =
            foto.url;


          imagen.alt =
            foto.nombre ||
            "Foto del evento";


          imagen.loading =
            "lazy";


          imagen.onerror =
            function () {

              imagen.style.display =
                "none";

            };


          const botones =
            document.createElement("div");


          botones.className =
            "foto-botones";


          /*
           * BOTÓN DESCARGAR
           */

          const botonDescargar =
            document.createElement("button");


          botonDescargar.textContent =
            "⬇️ Descargar";


          botonDescargar.onclick =
            function () {

              window.open(
                foto.download ||
                foto.url,
                "_blank"
              );

            };


          /*
           * BOTÓN QR
           */

          const botonQR =
            document.createElement("button");


          botonQR.textContent =
            "🔳 QR";


          botonQR.onclick =
            function () {

              mostrarQR(
                foto.url
              );

            };


          botones.appendChild(
            botonDescargar
          );


          botones.appendChild(
            botonQR
          );


          tarjeta.appendChild(
            imagen
          );


          tarjeta.appendChild(
            botones
          );


          listaFotos.appendChild(
            tarjeta
          );

        }
      );

    }


    /* =====================================================
       MOSTRAR QR
       ===================================================== */

    function mostrarQR(urlFoto) {

      if (!urlFoto) {

        return;

      }


      const urlCodificada =
        encodeURIComponent(
          urlFoto
        );


      const qrURL =
        "https://api.qrserver.com/v1/create-qr-code/" +
        "?size=500x500" +
        "&data=" +
        urlCodificada;


      document
        .getElementById("imagenQR")
        .src =
        qrURL;


      document
        .getElementById("modalQR")
        .style.display =
        "flex";

    }


    /* =====================================================
       CERRAR QR
       ===================================================== */

    function cerrarQR() {

      document
        .getElementById("modalQR")
        .style.display =
        "none";

    }


    /* =====================================================
       CERRAR MODAL SI SE TOCA AFUERA
       ===================================================== */

    document
      .getElementById("modalQR")
      .addEventListener(
        "click",
        function (event) {

          if (
            event.target ===
            document.getElementById("modalQR")
          ) {

            cerrarQR();

          }

        }
      );


    /* =====================================================
       CARGAR GALERÍA AL ABRIR LA PÁGINA
       ===================================================== */

    window.addEventListener(
      "load",
      function () {

        cargarGaleria();

      }
    );


    /* =====================================================
       ACTUALIZAR GALERÍA CADA 15 SEGUNDOS
       ===================================================== */

    setInterval(
      function () {

        cargarGaleria();

      },
      15000
    );

  </script>

</body>
</html>
